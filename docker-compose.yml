# Segredos vêm do .env / Environment do Portainer — nada de senha aqui.
# Nome do serviço e rede alinhados com a stack Portainer (dockepanel).

services:
  dockpanel:
    image: redecoop/dockwatch:1.0.3
    container_name: dockwatch
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockpanel-data:/data
      - ${DOCKPANEL_PROJECT_DIR:-.}:/opt/dockpanel:ro
    environment:
      PORT: "8080"
      DOCKPANEL_DATA_DIR: /data
      DOCKPANEL_HOSTS: ${DOCKPANEL_HOSTS}
      DOCKPANEL_COMPOSE_PATH: ${DOCKPANEL_COMPOSE_PATH:-/opt/dockpanel}
      DOCKPANEL_BACKUP_DIR: ${DOCKPANEL_BACKUP_DIR:-/data/backups}
      DOCKPANEL_JWT_SECRET: ${DOCKPANEL_JWT_SECRET}
      DOCKPANEL_ADMIN_EMAIL: ${DOCKPANEL_ADMIN_EMAIL}
      DOCKPANEL_ADMIN_PASSWORD: ${DOCKPANEL_ADMIN_PASSWORD}
      DOCKPANEL_ADMIN_NAME: ${DOCKPANEL_ADMIN_NAME:-Administrador}
      TZ: ${TZ:-America/Sao_Paulo}
      DOCKPANEL_LOG_RETENTION_DAYS: ${DOCKPANEL_LOG_RETENTION_DAYS:-60}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID}
      ALERT_DAILY_HOUR: ${ALERT_DAILY_HOUR:-9}
      ALERT_DISCORD_WEBHOOK: ${ALERT_DISCORD_WEBHOOK}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    networks:
      - dockpanel

networks:
  dockpanel:
    name: dockpanel
    driver: bridge

volumes:
  dockpanel-data:
